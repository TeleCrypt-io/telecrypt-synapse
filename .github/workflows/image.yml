name: build telecrypt-synapse

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after tests pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      synapse_version: ${{ steps.version.outputs.SYNAPSE_VERSION }}
      s3_provider_version: ${{ steps.version.outputs.S3_PROVIDER_VERSION }}
      controlplane_release: ${{ steps.version.outputs.CONTROLPLANE_RELEASE }}
      image_tag: ${{ steps.version.outputs.IMAGE_TAG }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 .github/validate_versions.py versions.env >> "$GITHUB_OUTPUT"
          case "$EVENT_NAME" in
            pull_request) publish=false ;;
            workflow_dispatch) publish="$INPUT_PUBLISH" ;;
            *) echo "unsupported release event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
      - name: Require the matching annotated release tag for publication
        if: steps.version.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.IMAGE_TAG }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/$EXPECTED_TAG"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "publish=true requires workflow_dispatch on $expected_ref (got $GITHUB_REF)" >&2
            exit 2
          fi
          if [ "$(git cat-file -t "$expected_ref" 2>/dev/null || true)" != "tag" ]; then
            echo "$expected_ref must be an annotated Git tag" >&2
            exit 2
          fi
          tagged_sha="$(git rev-parse "$expected_ref^{}")"
          if [ "$tagged_sha" != "$EXPECTED_SHA" ]; then
            echo "$expected_ref does not point at the checked-out commit" >&2
            exit 2
          fi
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged_sha" refs/remotes/origin/main; then
            echo "$expected_ref does not point at a commit contained in refreshed origin/main" >&2
            exit 2
          fi

  test:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build and test exact candidate
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: test
          push: false
          build-args: |
            SYNAPSE_VERSION=${{ needs.versions.outputs.synapse_version }}
            S3_PROVIDER_VERSION=${{ needs.versions.outputs.s3_provider_version }}
            CONTROLPLANE_RELEASE=${{ needs.versions.outputs.controlplane_release }}

  publish:
    if: needs.versions.outputs.publish == 'true'
    needs: [versions, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing immutable release tag
        env:
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          if inspection="$(docker manifest inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "immutable image already published: $IMAGE:$TAG" >&2
            exit 1
          elif printf '%s\n' "$inspection" | grep -Eqi 'manifest unknown|no such manifest|not found'; then
            echo "immutable image is absent: $IMAGE:$TAG"
          else
            echo "cannot prove whether immutable image exists: $IMAGE:$TAG" >&2
            exit 1
          fi
      - id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/telecrypt-io/telecrypt-synapse:${{ needs.versions.outputs.image_tag }}
          build-args: |
            SYNAPSE_VERSION=${{ needs.versions.outputs.synapse_version }}
            S3_PROVIDER_VERSION=${{ needs.versions.outputs.s3_provider_version }}
            CONTROLPLANE_RELEASE=${{ needs.versions.outputs.controlplane_release }}
          labels: |
            org.opencontainers.image.source=https://github.com/TeleCrypt-io/telecrypt-synapse
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.versions.outputs.image_tag }}
            org.opencontainers.image.base.name=ghcr.io/element-hq/synapse
            org.opencontainers.image.base.version=v${{ needs.versions.outputs.synapse_version }}
            org.telecrypt.s3-provider.version=${{ needs.versions.outputs.s3_provider_version }}
            org.telecrypt.controlplane.release=${{ needs.versions.outputs.controlplane_release }}
      - uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-name: ghcr.io/telecrypt-io/telecrypt-synapse
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
