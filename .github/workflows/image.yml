name: build telecrypt-synapse

on:
  pull_request:
  workflow_dispatch:
    inputs:
      synapse_version:
        description: Upstream Synapse version without the leading v
        required: true
        default: "1.158.0"
      telecrypt_revision:
        description: Immutable TeleCrypt revision for this upstream version
        required: true
        default: "1"
      publish:
        description: Publish after tests pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse
  S3_PROVIDER_VERSION: "1.7.0"
  # Sole source of the exact external tier-controller release for every event type. Dockerfile
  # deliberately has no default; changing this value requires a reviewed workflow change.
  CONTROLPLANE_RELEASE: "0.3.21"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      synapse_version: ${{ steps.version.outputs.synapse_version }}
      telecrypt_revision: ${{ steps.version.outputs.telecrypt_revision }}
      controlplane_release: ${{ steps.version.outputs.controlplane_release }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.synapse_version }}
          INPUT_REVISION: ${{ inputs.telecrypt_revision }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          controlplane_release="${CONTROLPLANE_RELEASE:-}"
          if [ -z "$controlplane_release" ]; then
            echo "CONTROLPLANE_RELEASE must be set explicitly" >&2
            exit 2
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            revision="$INPUT_REVISION"
            publish="$INPUT_PUBLISH"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            version="1.158.0"
            revision="1"
            publish="false"
          else
            echo "unsupported release event: $EVENT_NAME" >&2
            exit 2
          fi
          case "$version" in
            *[!0-9.]*|*..*|.|"") echo "invalid upstream version: $version" >&2; exit 2 ;;
          esac
          case "$revision" in
            *[!0-9]*|"") echo "invalid TeleCrypt revision: $revision" >&2; exit 2 ;;
          esac
          case "$controlplane_release" in
            *[!0-9.]*|*..*|.|"") echo "invalid controlplane release: $controlplane_release" >&2; exit 2 ;;
          esac
          upstream_line="$(printf '%s\n' "$version" | awk -F. 'NF == 3 { print $1 "." $2 }')"
          case "$upstream_line" in
            *[!0-9.]*|*..*|.|"") echo "invalid upstream release line: $upstream_line" >&2; exit 2 ;;
          esac
          image_tag="${upstream_line}-tc${revision}"
          printf 'synapse_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'telecrypt_revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'controlplane_release=%s\n' "$controlplane_release" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build and test exact candidate
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: test
          push: false
          build-args: |
            SYNAPSE_VERSION=v${{ needs.discover.outputs.synapse_version }}
            S3_PROVIDER_VERSION=${{ env.S3_PROVIDER_VERSION }}
            CONTROLPLANE_RELEASE=${{ needs.discover.outputs.controlplane_release }}

  publish:
    if: needs.discover.outputs.publish == 'true'
    needs: [discover, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        name: Detect an existing immutable release tag
        env:
          TAG: ${{ needs.discover.outputs.image_tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "immutable image already published: $IMAGE:$TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/telecrypt-io/telecrypt-synapse:${{ needs.discover.outputs.image_tag }}
          build-args: |
            SYNAPSE_VERSION=v${{ needs.discover.outputs.synapse_version }}
            S3_PROVIDER_VERSION=${{ env.S3_PROVIDER_VERSION }}
            CONTROLPLANE_RELEASE=${{ needs.discover.outputs.controlplane_release }}
          labels: |
            org.opencontainers.image.source=https://github.com/TeleCrypt-io/telecrypt-synapse
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.discover.outputs.image_tag }}
            org.opencontainers.image.base.name=ghcr.io/element-hq/synapse
            org.opencontainers.image.base.version=v${{ needs.discover.outputs.synapse_version }}
            org.telecrypt.s3-provider.version=${{ env.S3_PROVIDER_VERSION }}
            org.telecrypt.controlplane.release=${{ needs.discover.outputs.controlplane_release }}
      - if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-name: ghcr.io/telecrypt-io/telecrypt-synapse
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
